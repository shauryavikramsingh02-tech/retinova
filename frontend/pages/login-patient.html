<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal Login - RetinaCare</title>
  <meta name="description" content="Dedicated Patient Health Portal login to access retinal screening results and history.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <!-- Navbar -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="/pages/login.html" class="nav-brand">
        <div class="brand-icon" style="background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" stroke-width="2"/>
            <path d="M2 12C3.8 6.6 7.6 3 12 3c4.4 0 8.2 3.6 10 9-1.8 5.4-5.6 9-10 9-4.4 0-8.2-3.6-10-9z" stroke-width="2"/>
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-title">RetinaCare</span>
          <span class="brand-subtitle">Patient Health Portal</span>
        </div>
      </a>

      <div class="nav-meta">
        <a href="/pages/login.html" class="btn btn-ghost btn-sm">
          &larr; All Portals
        </a>
      </div>
    </nav>
  </header>

  <!-- Login Container -->
  <main class="auth-container" style="max-width: 520px;">
    <div class="auth-box">

      <!-- Header Icon & Title -->
      <div class="auth-header">
        <div class="auth-header-icon patient-theme">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h1 class="auth-title">Patient Portal</h1>
        <p class="auth-subtitle">Access your retinal scans, AI grading, and follow-up reports</p>
      </div>

      <!-- Navigation Tabs: Sign In / Register -->
      <div class="auth-tabs">
        <button type="button" id="tab-btn-signin" class="auth-tab active">Patient Sign In</button>
        <button type="button" id="tab-btn-register" class="auth-tab">New Patient Registration</button>
      </div>

      <!-- TAB 1: SIGN IN -->
      <div id="tab-content-signin">
        <!-- Demo Autofill Helper -->
        <div class="demo-credentials-pill" style="border-color: rgba(16, 185, 129, 0.3);">
          <div>
            <span style="color: var(--text-dim);">Evaluator Demo:</span>
            <code style="color: #34d399; background: rgba(16, 185, 129, 0.1);">patient</code> / <code style="color: #34d399; background: rgba(16, 185, 129, 0.1);">patient123</code>
          </div>
          <button type="button" id="btn-autofill-patient" class="btn-autofill">
            Auto Fill
          </button>
        </div>

        <form id="patient-login-form">
          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="patient-username" class="form-label">Patient ID, Email, or Username</label>
            <input 
              type="text" 
              id="patient-username" 
              name="username" 
              class="form-control" 
              placeholder="e.g. RC-2026-0001 or patient" 
              required 
              autocomplete="username"
            />
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="patient-password" class="form-label">Password</label>
            <input 
              type="password" 
              id="patient-password" 
              name="password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            />
          </div>

          <div id="patient-error-alert" class="alert alert-danger" style="display: none; margin-bottom: 1.25rem; font-size: 0.85rem;"></div>

          <button type="submit" id="btn-submit-patient" class="btn portal-btn" style="background: linear-gradient(135deg, #059669, #10b981); color: #ffffff; width: 100%;">
            <span id="btn-patient-text">Enter Patient Health Portal</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>
      </div>

      <!-- TAB 2: REGISTER -->
      <div id="tab-content-register" style="display: none;">
        <form id="patient-register-form">
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="reg-fullname" class="form-label">Full Legal Name *</label>
            <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Priya Sharma" required />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
              <label for="reg-age" class="form-label">Age *</label>
              <input type="number" id="reg-age" class="form-control" min="1" max="120" placeholder="e.g. 52" required />
            </div>
            <div class="form-group">
              <label for="reg-gender" class="form-label">Gender *</label>
              <select id="reg-gender" class="form-control" required>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
              <label for="reg-phone" class="form-label">Phone Number</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" />
            </div>
            <div class="form-group">
              <label for="reg-email" class="form-label">Email Address</label>
              <input type="email" id="reg-email" class="form-control" placeholder="priya@example.com" />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="reg-diabetes" class="form-label">Diabetes Type</label>
            <select id="reg-diabetes" class="form-control">
              <option value="None">None</option>
              <option value="Type 2">Type 2 Diabetes</option>
              <option value="Type 1">Type 1 Diabetes</option>
              <option value="Gestational">Gestational Diabetes</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="reg-password" class="form-label">Create Password (min 6 characters) *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required />
          </div>

          <div id="register-error-alert" class="alert alert-danger" style="display: none; margin-bottom: 1.25rem; font-size: 0.85rem;"></div>

          <button type="submit" id="btn-submit-reg" class="btn portal-btn" style="background: linear-gradient(135deg, #059669, #10b981); color: #ffffff; width: 100%;">
            <span id="btn-reg-text">Register & Access Health Portal</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>
      </div>

      <!-- Switch Portal Links -->
      <div class="portal-switch-links">
        Need another portal?
        <a href="/pages/login-doctor.html">Doctor Login</a> &bull;
        <a href="/pages/login-admin.html">Admin Login</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div>
      RetinaCare &bull; <span class="footer-highlight" style="color: #34d399;">Patient Health Portal</span>
    </div>
    <div>Secure Offline Records</div>
  </footer>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in as patient, redirect
      const existingUser = Auth.getUser();
      if (existingUser && existingUser.role === 'patient') {
        window.location.href = "/pages/patient_portal.html";
        return;
      }

      // Tab Switching
      const tabSignIn = document.getElementById("tab-btn-signin");
      const tabRegister = document.getElementById("tab-btn-register");
      const contentSignIn = document.getElementById("tab-content-signin");
      const contentRegister = document.getElementById("tab-content-register");

      tabSignIn.addEventListener("click", () => {
        tabSignIn.classList.add("active");
        tabRegister.classList.remove("active");
        contentSignIn.style.display = "block";
        contentRegister.style.display = "none";
      });

      tabRegister.addEventListener("click", () => {
        tabRegister.classList.add("active");
        tabSignIn.classList.remove("active");
        contentRegister.style.display = "block";
        contentSignIn.style.display = "none";
      });

      // Autofill
      const autofillBtn = document.getElementById("btn-autofill-patient");
      const usernameInput = document.getElementById("patient-username");
      const passwordInput = document.getElementById("patient-password");
      const errorAlert = document.getElementById("patient-error-alert");

      autofillBtn.addEventListener("click", () => {
        usernameInput.value = "patient";
        passwordInput.value = "patient123";
        errorAlert.style.display = "none";
      });

      // Sign In Form Submission
      const loginForm = document.getElementById("patient-login-form");
      const submitBtn = document.getElementById("btn-submit-patient");
      const btnPatientText = document.getElementById("btn-patient-text");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorAlert.style.display = "none";

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) return;

        btnPatientText.textContent = "Verifying...";
        submitBtn.disabled = true;

        try {
          const res = await AuthAPI.login(username, password, "patient");
          Auth.setSession(res.token, res.user);
          showToast(`Welcome back, ${res.user.full_name}!`, "success");
          setTimeout(() => {
            window.location.href = "/pages/patient_portal.html";
          }, 600);
        } catch (err) {
          errorAlert.textContent = err.message || "Failed to sign in. Please verify your Patient ID/username.";
          errorAlert.style.display = "block";
          submitBtn.disabled = false;
          btnPatientText.textContent = "Enter Patient Health Portal";
        }
      });

      // Register Form Submission
      const regForm = document.getElementById("patient-register-form");
      const regErrorAlert = document.getElementById("register-error-alert");
      const submitRegBtn = document.getElementById("btn-submit-reg");
      const btnRegText = document.getElementById("btn-reg-text");

      regForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        regErrorAlert.style.display = "none";

        const payload = {
          full_name: document.getElementById("reg-fullname").value.trim(),
          age: parseInt(document.getElementById("reg-age").value),
          gender: document.getElementById("reg-gender").value,
          contact_phone: document.getElementById("reg-phone").value.trim() || null,
          contact_email: document.getElementById("reg-email").value.trim() || null,
          diabetes_type: document.getElementById("reg-diabetes").value,
          password: document.getElementById("reg-password").value
        };

        btnRegText.textContent = "Creating Account...";
        submitRegBtn.disabled = true;

        try {
          const res = await AuthAPI.registerPatient(payload);
          Auth.setSession(res.token, res.user);
          showToast("Account created successfully! Loading your health portal...", "success");
          setTimeout(() => {
            window.location.href = "/pages/patient_portal.html";
          }, 600);
        } catch (err) {
          regErrorAlert.textContent = err.message || "Registration failed. Please check inputs.";
          regErrorAlert.style.display = "block";
          submitRegBtn.disabled = false;
          btnRegText.textContent = "Register & Access Health Portal";
        }
      });
    });
  </script>
</body>
</html>
