<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Portal Login - RetinaCare</title>
  <meta name="description" content="Dedicated Clinician & Ophthalmologist workstation login for retinal tele-screening.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <!-- Navbar -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="/pages/login.html" class="nav-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" stroke-width="2"/>
            <path d="M2 12C3.8 6.6 7.6 3 12 3c4.4 0 8.2 3.6 10 9-1.8 5.4-5.6 9-10 9-4.4 0-8.2-3.6-10-9z" stroke-width="2"/>
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-title">RetinaCare</span>
          <span class="brand-subtitle">Clinician Diagnostic Workstation</span>
        </div>
      </a>

      <div class="nav-meta">
        <a href="/pages/login.html" class="btn btn-ghost btn-sm">
          &larr; All Portals
        </a>
      </div>
    </nav>
  </header>

  <!-- Login Container -->
  <main class="auth-container">
    <div class="auth-box">

      <!-- Header Icon & Title -->
      <div class="auth-header">
        <div class="auth-header-icon doctor-theme">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/>
            <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/>
            <circle cx="20" cy="10" r="2"/>
          </svg>
        </div>
        <h1 class="auth-title">Doctor Portal</h1>
        <p class="auth-subtitle">Sign in to access patient diagnostics, fundus intake, and AI inference</p>
      </div>

      <!-- Demo Autofill Helper -->
      <div class="demo-credentials-pill">
        <div>
          <span style="color: var(--text-dim);">Evaluator Demo:</span>
          <code>doctor</code> / <code>doctor123</code>
        </div>
        <button type="button" id="btn-autofill-doctor" class="btn-autofill">
          Auto Fill
        </button>
      </div>

      <!-- Login Form -->
      <form id="doctor-login-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="doctor-username" class="form-label">Doctor Username or Medical Email</label>
          <input 
            type="text" 
            id="doctor-username" 
            name="username" 
            class="form-control" 
            placeholder="e.g. doctor or dr.sharma@retinacare.local" 
            required 
            autocomplete="username"
          />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="doctor-password" class="form-label">Password</label>
          <input 
            type="password" 
            id="doctor-password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
        </div>

        <div id="login-error-alert" class="alert alert-danger" style="display: none; margin-bottom: 1.25rem; font-size: 0.85rem;"></div>

        <button type="submit" id="btn-submit-doctor" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          <span id="btn-text">Sign In to Clinician Station</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <!-- Switch Portal Links -->
      <div class="portal-switch-links">
        Need another portal?
        <a href="/pages/login-patient.html">Patient Login</a> &bull;
        <a href="/pages/login-admin.html">Admin Login</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div>
      RetinaCare &bull; <span class="footer-highlight">Clinician Station</span>
    </div>
    <div>Local SQLite &bull; PyTorch AI</div>
  </footer>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in as doctor or admin, offer instant redirect
      const existingUser = Auth.getUser();
      if (existingUser && (existingUser.role === 'doctor' || existingUser.role === 'admin')) {
        window.location.href = "/";
        return;
      }

      const form = document.getElementById("doctor-login-form");
      const usernameInput = document.getElementById("doctor-username");
      const passwordInput = document.getElementById("doctor-password");
      const autofillBtn = document.getElementById("btn-autofill-doctor");
      const errorAlert = document.getElementById("login-error-alert");
      const submitBtn = document.getElementById("btn-submit-doctor");
      const btnText = document.getElementById("btn-text");

      // Auto-fill button
      autofillBtn.addEventListener("click", () => {
        usernameInput.value = "doctor";
        passwordInput.value = "doctor123";
        errorAlert.style.display = "none";
      });

      // Submit form
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorAlert.style.display = "none";

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) return;

        btnText.textContent = "Authenticating...";
        submitBtn.disabled = true;

        try {
          const res = await AuthAPI.login(username, password, "doctor");
          Auth.setSession(res.token, res.user);
          showToast(`Welcome back, ${res.user.full_name}!`, "success");
          setTimeout(() => {
            window.location.href = res.redirect_url || "/";
          }, 600);
        } catch (err) {
          errorAlert.textContent = err.message || "Invalid credentials. Please verify and try again.";
          errorAlert.style.display = "block";
          submitBtn.disabled = false;
          btnText.textContent = "Sign In to Clinician Station";
        }
      });
    });
  </script>
</body>
</html>
